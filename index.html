<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Source Code Fetcher</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="url"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .status.loading {
            background: #fef3cd;
            color: #997404;
            border: 1px solid #fde68a;
        }

        .status.success {
            background: #d1fae5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .status.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .code-container {
            margin-top: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        .code-header {
            background: #4a5568;
            color: white;
            padding: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-hint {
            font-size: 14px;
            opacity: 0.8;
        }

        pre {
            margin: 0;
            padding: 20px;
            background: #1a202c;
            color: #e2e8f0;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            cursor: pointer;
            transition: background-color 0.3s;
            max-height: 500px;
            overflow-y: auto;
        }

        pre:hover {
            background: #2d3748;
        }

        .copied-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 10;
        }

        .copied-feedback.show {
            opacity: 1;
        }

        .proxy-info {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1e40af;
        }

        .example {
            color: #6b7280;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 WebSim Source Fetcher</h1>
        
        <div class="proxy-info">
            <strong>📡 CORS Proxy:</strong> This tool uses multiple CORS proxies to bypass CORS restrictions and fetch source code from websim.com
        </div>

        <div class="input-group">
            <input 
                type="url" 
                id="urlInput" 
                placeholder="Enter websim.com URL..."
                value="https://websim.com/"
            >
            <button onclick="fetchSource()" id="fetchBtn">
                📥 Fetch Source
            </button>
        </div>
        
        <div class="example">
            Example: https://websim.com/c/your-project-id
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="codeContainer" class="code-container" style="display: none;">
            <div class="code-header">
                <span>📄 Source Code</span>
                <span class="copy-hint">Click code below to copy to clipboard</span>
            </div>
            <div style="position: relative;">
                <pre id="sourceCode" onclick="copyToClipboard()"></pre>
                <div id="copiedFeedback" class="copied-feedback">✅ Copied to clipboard!</div>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const status = document.getElementById('status');
        const codeContainer = document.getElementById('codeContainer');
        const sourceCode = document.getElementById('sourceCode');
        const copiedFeedback = document.getElementById('copiedFeedback');

        let currentSourceCode = '';

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }

        async function fetchSource() {
            const url = urlInput.value.trim();
            
            if (!url) {
                showStatus('❌ Please enter a URL', 'error');
                return;
            }

            if (!url.includes('websim.com')) {
                showStatus('⚠️ Please enter a valid websim.com URL', 'error');
                return;
            }

            fetchBtn.disabled = true;
            showStatus('🔄 Fetching source code...', 'loading');
            codeContainer.style.display = 'none';

            // Multiple CORS proxies to try as fallbacks
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://cors-anywhere.herokuapp.com/${url}`,
                `https://thingproxy.freeboard.io/fetch/${url}`
            ];

            for (let i = 0; i < proxies.length; i++) {
                try {
                    showStatus(`🔄 Trying proxy ${i + 1}/${proxies.length}...`, 'loading');
                    
                    const response = await fetch(proxies[i], {
                        method: 'GET',
                        headers: {
                            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        },
                        timeout: 30000 // 30 second timeout
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const html = await response.text();
                    
                    if (!html || html.trim().length === 0) {
                        throw new Error('No content received from the URL');
                    }

                    // Check if we got an error page or incomplete response
                    if (html.length < 1000 && (html.includes('error') || html.includes('Error') || html.includes('404'))) {
                        throw new Error('Received error page or incomplete response');
                    }

                    currentSourceCode = html;
                    sourceCode.textContent = html;
                    codeContainer.style.display = 'block';
                    showStatus(`✅ Successfully fetched ${html.length.toLocaleString()} characters from proxy ${i + 1}`, 'success');
                    
                    // Auto-hide success message after 3 seconds
                    setTimeout(() => {
                        hideStatus();
                    }, 3000);

                    return; // Success, exit the loop

                } catch (error) {
                    console.error(`Proxy ${i + 1} failed:`, error);
                    if (i === proxies.length - 1) {
                        // Last proxy failed
                        showStatus(`❌ All proxies failed. Last error: ${error.message}`, 'error');
                        codeContainer.style.display = 'none';
                    }
                    // Continue to next proxy
                }
            }

            fetchBtn.disabled = false;
        }

        async function copyToClipboard() {
            if (!currentSourceCode) {
                showStatus('❌ No source code to copy', 'error');
                return;
            }

            try {
                await navigator.clipboard.writeText(currentSourceCode);
                
                // Show copy feedback
                copiedFeedback.classList.add('show');
                setTimeout(() => {
                    copiedFeedback.classList.remove('show');
                }, 2000);

            } catch (error) {
                console.error('Copy error:', error);
                
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = currentSourceCode;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    copiedFeedback.classList.add('show');
                    setTimeout(() => {
                        copiedFeedback.classList.remove('show');
                    }, 2000);
                } catch (fallbackError) {
                    showStatus('❌ Failed to copy to clipboard', 'error');
                }
                document.body.removeChild(textArea);
            }
        }

        // Allow Enter key to trigger fetch
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fetchSource();
            }
        });

        // Auto-focus URL input
        urlInput.focus();
    </script>

</body>
</html>
